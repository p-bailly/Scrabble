<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#a9d3f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e2238" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Scrabble en français : duplicate en solo, parties à deux en différé, calculateur de meilleur coup." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scrabble" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Scrabble</title>
    <script>
      // Thème choisi dans les réglages, posé avant le premier affichage (pas d'éclair clair sur un téléphone en sombre).
      // Même calcul que estSombre() dans src/lib/reglages.ts.
      ;(function () {
        var theme
        try {
          theme = JSON.parse(localStorage.getItem('scrabble.reglages') || '{}').theme
        } catch (e) {}
        var sombre = theme === 'sombre' || (theme !== 'clair' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = sombre ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
